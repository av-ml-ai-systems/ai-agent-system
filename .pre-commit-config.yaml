# Module: .pre-commit-config.yaml
# Location: project root
#
# Purpose
# -------
# This configuration defines the automated quality checks executed before
# creating Git commits.
#
# The objective is to prevent low-quality code from entering the repository by
# automatically running development tools such as Ruff and MyPy.
#
# Note:
# Pytest is intentionally not included here because integration tests involving
# local LLM inference can take several minutes. Full testing is executed
# manually with:
#
#     uv run pytest
#

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-format

      - id: ruff

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy