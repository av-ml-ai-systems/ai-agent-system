[project]
name = "ai-agent-system"
version = "0.1.0"
description = "An AI Agent system designed to apply software engineering principles, agent architecture patterns, and LLM integration."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alvaro Vega" }
]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "streamlit>=1.60.0",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
mypy_path = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
