[project]
name = "ai-agent-system"
version = "0.1.0"
description = "An AI Agent system designed to apply software engineering principles, agent architecture patterns, and LLM integration."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alvaro Vega" }
]
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
mypy_path = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
